{% extends "layout.html" %}

{% block title %}
  Drill
{% endblock %}

{% block main %}
  <div class="drill">
    <div class="phone">
      <div class="messages">
        {% for message in messages %}
          <div class="message {{ 'sent' if message.sender == 'user' else 'received' }}">
            {{ message.text }}
          </div>
        {% endfor %}
      </div>
      <form class="compose" action="{{ url_for('drill.drill') }}" method="post">
        <textarea name="text" rows="1" placeholder="Send message" autocomplete="off" required></textarea>
        <input type="text" name="scenario_id" hidden="true" value="{{ scenario_id }}" required>
        <button type="submit" aria-label="Send">&#8593;</button>
      </form>
    </div>
    <div class="results"></div>
  </div>
  <script src="{{ url_for('static', filename='drill.js') }}"></script>
{% endblock %}
