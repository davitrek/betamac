<!DOCTYPE html>

<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width, interactive-widget=resizes-content">

    <link rel="icon" type="image/png" href="/static/favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/static/favicon/favicon.svg" />
    <link rel="shortcut icon" href="/static/favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/static/favicon/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="betamac" />
    <link rel="manifest" href="/static/favicon/site.webmanifest" />

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <title>{% block title %}{% endblock %}</title>

  </head>

  <body>
    <nav class="navbar">
      <a class="brand" href="{{ url_for('drill.drill') }}">betamac</a>
      <a class="pill" href="{{ url_for('scenarios.create_new') }}">Submit scenario</a>
    </nav>

    <section>
      {% block flashes %}
        {% if get_flashed_messages() %}
          <header>
            <div role="alert">
              {{ get_flashed_messages() | join(" ") }}
            </div>
          </header>
        {% endif %}
      {% endblock %}

      <main>
        {% block main %}{% endblock %}
      </main>
    </section>
  </body>

</html>
